<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>💙 与他的邂逅</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --primary: #4a90e2;
            --primary-light: #89bff8;
            --primary-dark: #2c6cb0;
            --glass-bg: rgba(255, 255, 255, 0.65);
            --glass-border: rgba(255, 255, 255, 0.8);
            --text-main: #1a2a3a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Georgia', 'PingFang SC', serif; height: 100vh; display: flex; justify-content: center; align-items: flex-start; padding-top: 4vh;
            background: #e6f2ff; background-size: cover; background-position: center; background-repeat: no-repeat;
            transition: background 0.5s ease; margin: 0; position: relative; overflow: hidden;
        }

        /* ===== 特效层 ===== */
        .snow-layer { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 998; overflow: hidden; }
        .snow-layer .flake { position: absolute; top: -30px; color: rgba(255, 255, 255, 0.9); filter: drop-shadow(0 0 4px rgba(180, 220, 255, 0.8)); animation: snowFall linear infinite; }
        @keyframes snowFall { 0% { transform: translateY(-6vh) translateX(0) rotate(0deg); opacity: 0; } 8% { opacity: 1; } 50% { transform: translateY(50vh) translateX(4vw) rotate(180deg); } 92% { opacity: 1; } 100% { transform: translateY(106vh) translateX(-2vw) rotate(360deg); opacity: 0; } }
        
        /* ===== 聊天容器 ===== */
        .chat-container {
            width: 600px; height: 800px; max-width: 94vw; max-height: 88vh; 
            background: var(--glass-bg); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            border-radius: 32px; box-shadow: 0 20px 60px rgba(74, 144, 226, 0.15); display: flex; flex-direction: column; 
            overflow: hidden; border: 1px solid var(--glass-border); position: relative; z-index: 10; transition: all 0.4s ease; margin: 0 auto;
        }

        /* ===== 头部 ===== */
        .chat-nav { display: flex; align-items: center; padding: 16px 24px; border-bottom: 1px solid rgba(255,255,255,0.5); flex-shrink: 0; gap: 14px; background: rgba(255,255,255,0.3); }
        .nav-avatar { width: 44px; height: 44px; border-radius: 50%; border: 2px solid #fff; flex-shrink: 0; background: #dbeafe; display: flex; align-items: center; justify-content: center; font-size: 20px; color: var(--text-main); overflow: hidden; box-shadow: 0 4px 10px rgba(74,144,226,0.1); cursor: pointer; transition: transform 0.2s; }
        .nav-avatar:hover { transform: scale(1.05); }
        .nav-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .nav-info { flex: 1; cursor: pointer; }
        .nav-name { font-size: 18px; font-weight: 600; color: var(--text-main); letter-spacing: 0.5px; }
        .nav-status { font-size: 13px; color: var(--text-main); opacity: 0.8; display: flex; align-items: center; gap: 6px; margin-top: 2px; }
        .nav-status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--primary); flex-shrink: 0; transition: background 0.4s; }
        
        /* 朋友圈与菜单按钮 */
        .nav-btn-group { display: flex; gap: 8px; }
        .nav-icon-btn { background: rgba(255,255,255,0.6); border: 1px solid rgba(255,255,255,0.8); color: var(--text-main); font-size: 18px; cursor: pointer; width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .nav-icon-btn:hover { background: #fff; }

        /* ===== 聊天区 ===== */
        .chat-messages { flex: 1; padding: 20px 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
        .chat-messages::-webkit-scrollbar { width: 4px; }
        .chat-messages::-webkit-scrollbar-thumb { background: rgba(74,144,226,0.2); border-radius: 10px; }
        
        .date-divider { text-align: center; font-size: 12px; color: rgba(26, 42, 58, 0.4); padding: 10px 0; font-weight: 500; }
        
        .message-wrapper { display: flex; align-items: flex-end; gap: 12px; margin-bottom: 6px; animation: messageSlideIn 0.35s ease-out; position: relative; }
        @keyframes messageSlideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .message-wrapper.user { justify-content: flex-end; }
        .message-wrapper.user .avatar { order: 1; }
        .avatar { width: 42px; height: 42px; border-radius: 50%; flex-shrink: 0; background: #fff; display: flex; align-items: center; justify-content: center; font-size: 20px; color: var(--text-main); border: 2px solid #fff; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        
        .message { padding: 14px 20px; border-radius: 22px; max-width: 76%; word-wrap: break-word; line-height: 1.6; font-size: 15px; position: relative; color: var(--text-main); box-shadow: 0 4px 15px rgba(0,0,0,0.03); cursor: pointer; }
        .message.user { background: linear-gradient(135deg, #c2e0ff 0%, #a4c9f0 100%); border-bottom-right-radius: 6px; border: 1px solid #fff; }
        .message.bot { background: rgba(255, 255, 255, 0.9); border-bottom-left-radius: 6px; border: 1px solid #fff; }
        .message .time { font-size: 10px; opacity: 0.4; margin-left: 8px; display: inline-block; }
        
        .delete-btn { position: absolute; top: -8px; width: 22px; height: 22px; background: var(--primary); color: #fff; border-radius: 50%; display: none; align-items: center; justify-content: center; font-size: 12px; cursor: pointer; box-shadow: 0 2px 8px rgba(74,144,226,0.4); z-index: 10; transition: 0.2s; }
        .message-wrapper.user .delete-btn { left: -8px; }
        .message-wrapper.bot .delete-btn { right: -8px; }
        .message:hover .delete-btn { display: flex; }
        .message.active .delete-btn { display: flex; }

        .typing-indicator { align-self: flex-start; display: flex; align-items: center; gap: 4px; padding: 14px 20px; border-radius: 22px; border-bottom-left-radius: 6px; background: rgba(255, 255, 255, 0.9); margin-bottom: 6px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
        .typing-indicator span { width: 6px; height: 6px; background: var(--primary); border-radius: 50%; animation: typingBounce 1.2s ease-in-out infinite; }
        .typing-indicator span:nth-child(2) { animation-delay: 0.15s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.3s; }
        @keyframes typingBounce { 0%, 100% { opacity: 0.3; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-3px); } }

        /* ===== 输入区 ===== */
        .chat-input-area { display: flex; padding: 16px 24px; background: rgba(255,255,255,0.3); gap: 12px; align-items: center; border-top: 1px solid rgba(255,255,255,0.5); }
        .chat-input-area input { flex: 1; padding: 12px 20px; border: 1px solid rgba(255,255,255,0.8); border-radius: 24px; background: rgba(255,255,255,0.7); outline: none; font-size: 15px; color: var(--text-main); min-height: 46px; transition: 0.3s; box-shadow: inset 0 2px 5px rgba(0,0,0,0.02); }
        .chat-input-area input:focus { background: #fff; box-shadow: 0 0 0 3px rgba(74,144,226,0.15); }
        .chat-input-area button { padding: 0 24px; background: var(--primary); color: white; border: none; border-radius: 24px; font-size: 15px; cursor: pointer; font-weight: 600; flex-shrink: 0; min-height: 46px; transition: 0.2s; box-shadow: 0 4px 12px rgba(74,144,226,0.3); }

        /* ===== 音乐播放器 ===== */
        .music-player { position: fixed; top: 30px; right: 30px; z-index: 999; width: 300px; background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(24px); border-radius: 24px; padding: 16px; border: 1px solid var(--glass-border); box-shadow: 0 15px 35px rgba(74,144,226,0.1); transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); user-select: none; cursor: grab; touch-action: none; }
        .music-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 10px; margin-bottom: 12px; border-bottom: 1px solid rgba(0,0,0,0.05); }
        .track-name { color: var(--text-main); font-size: 14px; font-weight: 600; }
        .minimize-btn { background: rgba(0,0,0,0.05); border: none; color: var(--text-main); cursor: pointer; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; }
        .music-body { display: flex; flex-direction: column; gap: 12px; align-items: center; }
        .record-disc { width: 70px; height: 70px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #4a5a6a, #1a2a3a); position: relative; animation: spin 10s linear infinite; animation-play-state: paused; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .record-disc.playing { animation-play-state: running; }
        .record-disc .center-label { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 22px; height: 22px; border-radius: 50%; background: var(--primary-light); display: flex; align-items: center; justify-content: center; font-size: 10px; color: #fff; }
        .music-controls { display: flex; align-items: center; gap: 10px; width: 100%; }
        .music-controls button { background: var(--primary); border: none; border-radius: 50%; width: 32px; height: 32px; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .progress-slider { flex: 1; height: 4px; -webkit-appearance: none; background: rgba(74,144,226,0.15); border-radius: 4px; outline: none; }
        .progress-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: var(--primary); cursor: pointer; }
        .time-display { font-size: 11px; color: var(--text-main); opacity: 0.7; margin-top: 4px; }

        /* ===== 弹窗 & 菜单 ===== */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.3); backdrop-filter: blur(4px); z-index: 10000; display: none; align-items: center; justify-content: center; }
        .modal-overlay.show { display: flex; }
        .modal-box { background: #fff; border-radius: 20px; padding: 24px; width: 300px; max-width: 90vw; text-align: center; }
        .modal-title { font-size: 17px; font-weight: 600; color: var(--text-main); margin-bottom: 10px; }
        .modal-desc { font-size: 13px; color: #666; margin-bottom: 20px; }
        .modal-btns { display: flex; gap: 10px; }
        .modal-btn { flex: 1; padding: 10px 0; border: none; border-radius: 10px; font-size: 14px; cursor: pointer; }
        .modal-btn.cancel { background: #f0f0f0; color: #666; }
        .modal-btn.confirm { background: var(--primary); color: #fff; }

        .dropdown-menu { position: fixed; background: rgba(255,255,255,0.95); backdrop-filter: blur(20px); border-radius: 12px; padding: 6px; min-width: 140px; z-index: 9999; display: none; box-shadow: 0 8px 24px rgba(0,0,0,0.12); }
        .dropdown-menu.show { display: block; }
        .dropdown-menu .menu-item { padding: 10px 14px; font-size: 13px; color: var(--text-main); border: none; background: none; width: 100%; text-align: left; cursor: pointer; border-radius: 8px; display: flex; align-items: center; gap: 8px; }
        .dropdown-menu .menu-item:hover { background: rgba(74,144,226,0.1); color: var(--primary); }

        /* ===== 桌面宠物 ===== */
        .desktop-pet { position: fixed; z-index: 999; width: 200px; height: 200px; border-radius: 50%; cursor: grab; display: flex; align-items: center; justify-content: center; user-select: none; touch-action: none; }
        .desktop-pet img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; display: block; pointer-events: none; }
        .pet-bubble { position: absolute; bottom: calc(100% + 16px); left: 50%; transform: translateX(-50%); background: rgba(255,255,255,0.95); border-radius: 16px; padding: 10px 16px; font-size: 14px; color: var(--text-main); opacity: 0; transition: opacity 0.3s ease; pointer-events: none; white-space: nowrap; }
        .pet-bubble.show { opacity: 1; }

        /* ===== 微信同款朋友圈 ===== */
        .moments-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #fff; z-index: 100000; display: none; flex-direction: column; }
        .moments-overlay.show { display: flex; }
        .moments-header { background: #ededed; display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid #dcdcdc; }
        .moments-back { background: none; border: none; font-size: 20px; color: #333; cursor: pointer; width: 40px; text-align: left; }
        .moments-title { font-size: 17px; font-weight: 600; color: #000; }
        .moments-publish { background: none; border: none; font-size: 20px; color: #333; cursor: pointer; width: 40px; text-align: right; }
        .moments-content { flex: 1; overflow-y: auto; background: #fff; padding-bottom: 50px; }
        
        .moments-cover { height: 280px; background: url('images/bg.jpg') center/cover; position: relative; }
        .moments-cover-info { position: absolute; bottom: -30px; right: 20px; display: flex; align-items: flex-end; gap: 15px; }
        .moments-cover-name { font-size: 18px; font-weight: bold; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.5); margin-bottom: 35px; }
        .moments-avatar { width: 70px; height: 70px; border-radius: 10px; border: 3px solid #fff; object-fit: cover; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }

        .moment-list { margin-top: 40px; }
        .moment-post { padding: 20px; display: flex; gap: 12px; border-bottom: 1px solid #f0f0f0; }
        .moment-avatar { width: 44px; height: 44px; border-radius: 6px; object-fit: cover; flex-shrink: 0; }
        .moment-body { flex: 1; min-width: 0; }
        .moment-name { color: #576b95; font-weight: 600; font-size: 15px; margin-bottom: 4px; }
        .moment-text { font-size: 15px; color: #333; line-height: 1.5; margin-bottom: 8px; word-wrap: break-word; }
        .moment-time { font-size: 12px; color: #999; margin-bottom: 8px; }
        .moment-actions { display: flex; justify-content: flex-end; border-bottom: 1px solid #f0f0f0; padding-bottom: 8px; margin-bottom: 8px; }
        .moment-btn { background: #f7f7f7; border: none; padding: 4px 12px; border-radius: 4px; font-size: 13px; color: #576b95; cursor: pointer; }
        
        .moment-comments { background: #f7f7f7; border-radius: 4px; padding: 6px 12px; font-size: 14px; display: none; }
        .moment-comments.show { display: block; }
        .comment-item { padding: 4px 0; line-height: 1.4; word-wrap: break-word; }
        .comment-user { color: #576b95; font-weight: 600; }
        
        .comment-input-bar { display: none; background: #f7f7f7; padding: 8px 12px; border-radius: 4px; margin-top: 6px; gap: 8px; }
        .comment-input-bar.show { display: flex; }
        .comment-input-bar input { flex: 1; border: none; background: #fff; padding: 6px 10px; border-radius: 4px; font-size: 13px; outline: none; }
        .comment-input-bar button { background: #07c160; color: #fff; border: none; border-radius: 4px; padding: 0 12px; font-size: 13px; cursor: pointer; }

        /* 编辑朋友圈弹窗 */
        .publish-modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #fff; z-index: 100001; display: none; flex-direction: column; }
        .publish-modal.show { display: flex; }
        .publish-header { display: flex; justify-content: space-between; padding: 16px; border-bottom: 1px solid #eee; background: #ededed; }
        .publish-cancel { border:none; background:none; font-size:16px; color: #333; }
        .publish-submit { background: #07c160; color: #fff; border: none; padding: 6px 20px; border-radius: 4px; cursor: pointer; font-size: 15px; }
        .publish-textarea { flex: 1; border: none; outline: none; padding: 16px; font-size: 16px; resize: none; font-family: inherit; }

        /* ===== 移动端适配 ===== */
        @media (max-width: 640px) {
            body { padding-top: 0; align-items: stretch; }
            .chat-container { width: 100%; height: 100dvh; max-height: 100dvh; border-radius: 0; border: none; }
            .message { max-width: 82% !important; padding: 12px 16px; }
            .chat-input-area { padding: 12px 16px; }
            .chat-input-area input, .chat-input-area button { min-height: 40px; font-size: 14px; }
            .desktop-pet { width: 80px; height: 80px; bottom: 100px !important; left: 10px !important; top: auto !important; right: auto !important; }
            
            .music-player { top: 15px; right: 15px; width: 44px; height: 44px; padding: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 10000; background: rgba(255, 255, 255, 0.85); border: 1px solid rgba(74,144,226,0.3); box-shadow: 0 4px 15px rgba(74,144,226,0.2); transition: all 0.3s ease; overflow: hidden; }
            .music-player .music-header, .music-player .music-body { display: none !important; }
            .music-player.expanded { width: 220px; height: 54px; border-radius: 27px; padding: 8px 12px; flex-direction: row; background: rgba(255,255,255,0.98); align-items: center; }
            .music-player.expanded .music-body { display: flex !important; width: 100%; flex-direction: row; justify-content: space-between; align-items: center; gap: 8px; }
            .music-player.expanded .record-disc { display: none !important; }
            .music-player.expanded .time-display { font-size: 10px; }
            .mobile-music-icon { display: flex; font-size: 20px; color: var(--primary); width: 100%; height: 100%; align-items: center; justify-content: center; }
            .music-player.expanded .mobile-music-icon { display: none; }
        }
        @media (min-width: 641px) { .mobile-music-icon { display: none; } }
    </style>
</head>
<body>
    <input type="file" id="bgUpload" accept="image/*" style="display: none;">
    <input type="file" id="avatarUpload" accept="image/*" style="display: none;">

    <div class="snow-layer" id="snowLayer"></div>

    <!-- 聊天主界面 -->
    <div class="chat-container">
        <div class="chat-nav">
            <div class="nav-avatar" id="navAvatarBox"></div>
            <div class="nav-info">
                <div class="nav-name">黎深</div>
                <div class="nav-status">
                    <span class="dot" id="moodDot"></span>
                    <span id="moodText">在线 · 平静</span>
                </div>
            </div>
            <div class="nav-btn-group">
                <!-- 朋友圈专属入口，替代原先菜单里的选项 -->
                <button class="nav-icon-btn" id="momentsEntryBtn" title="朋友圈"><i class="fas fa-camera"></i></button>
                <button class="nav-icon-btn" id="menuBtn">☰</button>
            </div>
        </div>

        <div class="chat-messages" id="chatMessages"></div>

        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="输入你想说的话...">
            <button id="sendButton">发送</button>
        </div>
    </div>

    <!-- 下拉菜单 (移除了朋友圈入口) -->
    <div class="dropdown-menu" id="dropdownMenu">
        <button class="menu-item" onclick="toggleMusicPlayer()"><i class="fas fa-music"></i> 显示音乐</button>
        <button class="menu-item" onclick="triggerBgUpload()"><i class="fas fa-image"></i> 更换背景</button>
        <button class="menu-item" onclick="triggerAvatarUpload()"><i class="fas fa-user-circle"></i> 更换头像</button>
        <button class="menu-item" onclick="exportChat()"><i class="fas fa-download"></i> 导出对话</button>
        <button class="menu-item" onclick="toggleTheme()"><i class="fas fa-moon"></i> 夜间模式</button>
        <button class="menu-item" onclick="promptClear()" style="color: #e74c3c;"><i class="fas fa-trash-alt"></i> 清空全部</button>
    </div>

    <!-- 自定义弹窗 -->
    <div class="modal-overlay" id="customModal">
        <div class="modal-box">
            <div class="modal-title" id="modalTitle">提示</div>
            <div class="modal-desc" id="modalDesc">确定要执行此操作吗？</div>
            <div class="modal-btns">
                <button class="modal-btn cancel" onclick="closeModal()">取消</button>
                <button class="modal-btn confirm" id="modalConfirmBtn">确定</button>
            </div>
        </div>
    </div>

    <!-- 音乐播放器 -->
    <div class="music-player" id="musicPlayer">
        <span class="mobile-music-icon" id="mobileMusicIcon"><i class="fas fa-music"></i></span>
        <div class="music-header">
            <span class="track-name">🎵 正在播放</span>
            <button class="minimize-btn" id="musicMinimize"><i class="fas fa-times"></i></button>
        </div>
        <div class="music-body">
            <div class="record-disc" id="recordDisc"><div class="center-label">♪</div></div>
            <div class="music-controls">
                <button id="musicToggle"><i class="fas fa-play"></i></button>
                <input type="range" class="progress-slider" id="progressSlider" min="0" max="1" step="0.001" value="0">
            </div>
            <div class="time-display" id="timeDisplay">0:00 / 0:00</div>
        </div>
    </div>

    <!-- 桌面宠物 -->
    <div class="desktop-pet" id="desktopPet"></div>

    <!-- 微信同款朋友圈页面 -->
    <div class="moments-overlay" id="momentsOverlay">
        <div class="moments-header">
            <button class="moments-back" onclick="closeMoments()"><i class="fas fa-chevron-left"></i></button>
            <div class="moments-title">朋友圈</div>
            <button class="moments-publish" onclick="openPublishModal()"><i class="fas fa-camera"></i></button>
        </div>
        <div class="moments-content" id="momentsContent">
            <div class="moments-cover" id="momentsCover">
                <div class="moments-cover-info">
                    <span class="moments-cover-name">黎深</span>
                    <img src="" class="moments-avatar" id="momentsCoverAvatar">
                </div>
            </div>
            <div class="moment-list" id="momentsList"></div>
        </div>
    </div>

    <!-- 发朋友圈弹窗 -->
    <div class="publish-modal" id="publishModal">
        <div class="publish-header">
            <button class="publish-cancel" onclick="closePublishModal()">取消</button>
            <button class="publish-submit" onclick="submitMoment()">发表</button>
        </div>
        <textarea class="publish-textarea" id="publishText" placeholder="这一刻的想法..."></textarea>
    </div>

    <audio id="bgAudio" src="images/bg-music.mp3" loop preload="auto"></audio>

    <script>
        // ================= 核心配置 =================
        var API_URL = '/api/chat';
        var MODEL_NAME = 'qwen-plus';

        // ================= 微信同款时间格式化 =================
        function formatWechatTime(ts) {
            var now = new Date();
            var date = new Date(ts);
            var diff = now - date;
            if (diff < 60000) return '刚刚';
            if (diff < 3600000) return Math.floor(diff / 60000) + '分钟前';
            if (diff < 86400000) return Math.floor(diff / 3600000) + '小时前';
            
            var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            var target = new Date(date.getFullYear(), date.getMonth(), date.getDate());
            var dayDiff = Math.floor((today - target) / 86400000);
            if (dayDiff === 1) return '昨天';
            if (dayDiff === 2) return '前天';
            if (dayDiff < 7) return ['周日','周一','周二','周三','周四','周五','周六'][date.getDay()];
            return (date.getMonth() + 1) + '月' + date.getDate() + '日';
        }

        // 聊天日期分割
        function formatDate(ts) {
            var now = new Date(), msgDate = new Date(ts), today = new Date(now.getFullYear(), now.getMonth(), now.getDate()), target = new Date(msgDate.getFullYear(), msgDate.getMonth(), msgDate.getDate());
            var diff = Math.floor((today - target) / (24 * 60 * 60 * 1000));
            if (diff === 0) return '今天';
            if (diff === 1) return '昨天';
            if (diff > 1 && diff < 7) return ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'][msgDate.getDay()];
            return (msgDate.getMonth() + 1) + '月' + msgDate.getDate() + '日';
        }
        function appendDateDivider(ts) {
            var key = new Date(ts).toDateString();
            if (key !== lastDate) {
                lastDate = key;
                var div = document.createElement('div'); div.className = 'date-divider'; div.textContent = formatDate(ts); chatMessages.appendChild(div);
            }
        }

        // ================= 聊天与情绪 =================
        function getTimeString() { return new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }); }
        
        function extractMood(raw) {
            if (!raw) return { text: '', mood: null };
            var m = raw.match(/\[mood\s*[:：]\s*([^\]]+?)\s*\]/i);
            if (!m) return { text: raw.trim(), mood: null };
            return { text: raw.replace(m[0], '').trim(), mood: MOOD_MAP[m[1].trim()] ? m[1].trim() : null };
        }

        function updateMoodBar(mood) {
            var dot = document.getElementById('moodDot'), txt = document.getElementById('moodText');
            if (!dot || !txt) return;
            var finalMood = (mood && MOOD_MAP[mood]) ? mood : '平静';
            dot.style.background = MOOD_MAP[finalMood].color; txt.textContent = '在线 · ' + finalMood; txt.style.color = MOOD_MAP[finalMood].color;
            setStore('lishen_last_mood', finalMood);
        }

            var img = document.createElement('img'); img.className = 'avatar';
            img.src = sender === 'user' ? 'images/user.png' : (getStore('custom_avatar') || 'images/lishen.png');
            img.onerror = function() { this.style.display = 'none'; var div = document.createElement('div'); div.className = 'avatar'; div.textContent = sender === 'user' ? '👤' : '❄️'; this.parentNode.insertBefore(div, this); };
            return img;
        }

        function addMessage(text, sender, typing) {
            var ts = Date.now(), container = document.createElement('div');
            container.className = 'message-wrapper ' + sender;
            var msgId = 'msg-' + (++messageIdCounter) + '-' + ts;
            container.dataset.id = msgId; container.dataset.ts = ts;
            appendDateDivider(ts);
            var avatar = createAvatar(sender), div = document.createElement('div');
            div.className = 'message ' + sender;
            
            var delBtn = document.createElement('div');
            delBtn.className = 'delete-btn'; delBtn.innerHTML = '✕';
            delBtn.onclick = function(e) { e.stopPropagation(); deleteSingleMessage(msgId, container); };
            div.appendChild(delBtn);
            div.onclick = function(e) {
                if (e.target === delBtn) return;
                document.querySelectorAll('.message').forEach(function(m){ m.classList.remove('active'); });
                div.classList.add('active');
            };
            
            var contentSpan = document.createElement('span'); contentSpan.className = 'message-text';
            var timeSpan = document.createElement('span'); timeSpan.className = 'time'; timeSpan.textContent = getTimeString();
            
            div.appendChild(contentSpan); div.appendChild(timeSpan);
            container.appendChild(avatar); container.appendChild(div);
            chatMessages.appendChild(container); chatMessages.scrollTop = chatMessages.scrollHeight;

            if (typing && sender === 'bot') {
                var index = 0; contentSpan.textContent = '';
                var interval = setInterval(function() {
                    if (index < text.length) { contentSpan.textContent += text.charAt(index); chatMessages.scrollTop = chatMessages.scrollHeight; index++; }
                    else { clearInterval(interval); saveMessages(); }
                }, 20);
            } else { contentSpan.textContent = text; saveMessages(); }

        function deleteSingleMessage(msgId, container) {

                var key = new Date(ts).toDateString();
                if (key !== lastDate) { lastDate = key; var div = document.createElement('div'); div.className = 'date-divider'; div.textContent = formatDate(ts); wrapper.parentNode.insertBefore(div, wrapper); }

            }).then(function(res) { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })

        function makeDraggable(element) {
            if (!element) return;
            var startX = 0, startY = 0, origX = 0, origY = 0, isDragging = false;

            element.addEventListener('touchstart', function(e) {
                if (e.target.closest('button') || e.target.closest('input')) return;
                var touch = e.touches[0];
                startX = touch.clientX; startY = touch.clientY;
                var rect = element.getBoundingClientRect(); origX = rect.left; origY = rect.top;
                isDragging = true; element._wasDragged = false;
            }, { passive: true });

            element.addEventListener('touchmove', function(e) {
                if (!isDragging) return;
                var touch = e.touches[0], dx = touch.clientX - startX, dy = touch.clientY - startY;
                if (Math.abs(dx) > 5 || Math.abs(dy) > 5) element._wasDragged = true;
                element.style.position = 'fixed';
                element.style.left = (origX + dx) + 'px'; element.style.top = (origY + dy) + 'px';
                element.style.bottom = 'auto'; element.style.right = 'auto';
                if (e.cancelable) e.preventDefault();
            }, { passive: false });

            element.addEventListener('touchend', function() { isDragging = false; });
            
            element.addEventListener('mousedown', function(e) {
                if (e.target.closest('button') || e.target.closest('input')) return;
                startX = e.clientX; startY = e.clientY;
                var rect = element.getBoundingClientRect(); origX = rect.left; origY = rect.top;
                isDragging = true; element._wasDragged = false;
                e.preventDefault();
            });
            
            document.addEventListener('mousemove', function(e) {
                if (!isDragging) return;
                var dx = e.clientX - startX, dy = e.clientY - startY;
                if (Math.abs(dx) > 5 || Math.abs(dy) > 5) element._wasDragged = true;
                element.style.position = 'fixed';
                element.style.left = (origX + dx) + 'px'; element.style.top = (origY + dy) + 'px';
                element.style.bottom = 'auto'; element.style.right = 'auto';
            });
            document.addEventListener('mouseup', function() { isDragging = false; });
        }

        // ================= 弹窗与菜单 =================
        var modal = document.getElementById('customModal');
        var modalTitle = document.getElementById('modalTitle'), modalDesc = document.getElementById('modalDesc'), modalConfirmBtn = document.getElementById('modalConfirmBtn');
        var currentConfirmAction = null;
        function showModal(title, desc, btnText, callback) { modalTitle.textContent = title; modalDesc.textContent = desc; modalConfirmBtn.textContent = btnText; currentConfirmAction = callback; modal.classList.add('show'); }
        function closeModal() { modal.classList.remove('show'); }
        modalConfirmBtn.onclick = function() { if (currentConfirmAction) currentConfirmAction(); closeModal(); };

        function toggleTheme() { document.body.classList.toggle('night-mode'); }
        function exportChat() {
            var text = "";
            document.querySelectorAll('.message-wrapper').forEach(function(el) {
                var s = el.classList.contains('user') ? '我' : '黎深', t = el.querySelector('.message-text');
                if (t) text += s + "：" + t.textContent + "\n\n";
            });
            var blob = new Blob([text], {type: "text/plain;charset=utf-8"}), a = document.createElement("a");
            a.href = URL.createObjectURL(blob); a.download = "与黎深的对话.txt"; a.click();
        }
        function promptClear() {
            showModal('清空对话', '确定要清空所有聊天记录吗？他可能会有些失落。', '清空', function() {
                document.querySelectorAll('.message-wrapper').forEach(function(el){ el.remove(); });
                document.querySelectorAll('.date-divider').forEach(function(el){ el.remove(); });
                removeStore('chatHistory'); lastDate = ''; updateMoodBar('平静'); addMessage('你来了。我一直在等你。', 'bot', true);
            });
        }

        var menuBtn = document.getElementById('menuBtn'), dropdown = document.getElementById('dropdownMenu');
        menuBtn.onclick = function(e) {
            e.stopPropagation(); var rect = menuBtn.getBoundingClientRect();
            dropdown.style.left = (rect.left + rect.width - 140) + 'px'; dropdown.style.top = (rect.bottom + 10) + 'px';
            dropdown.classList.toggle('show');
        };
        document.addEventListener('click', function(e) { 
            if (!dropdown.contains(e.target) && e.target !== menuBtn) dropdown.classList.remove('show'); 
            if (!e.target.closest('.message')) document.querySelectorAll('.message').forEach(function(m){ m.classList.remove('active'); });
        });

        // 音乐控制
        var audio = document.getElementById('bgAudio'), recordDisc = document.getElementById('recordDisc'), desktopToggle = document.getElementById('musicToggle');
        var mobileIcon = document.getElementById('mobileMusicIcon'), musicPlayer = document.getElementById('musicPlayer'), progressSlider = document.getElementById('progressSlider'), timeDisplay = document.getElementById('timeDisplay');
        
        function formatTime(seconds) { if (isNaN(seconds)) return "0:00"; var m = Math.floor(seconds / 60), s = Math.floor(seconds % 60); return m + ":" + (s < 10 ? '0' : '') + s; }
        function togglePlay() {
            if (audio.paused) { audio.play().then(function(){ recordDisc.classList.add('playing'); desktopToggle.innerHTML = '<i class="fas fa-pause"></i>'; }).catch(function(){}); } 
            else { audio.pause(); recordDisc.classList.remove('playing'); desktopToggle.innerHTML = '<i class="fas fa-play"></i>'; }
        }
        desktopToggle.onclick = togglePlay;
        mobileIcon.onclick = function(e) { e.stopPropagation(); musicPlayer.classList.toggle('expanded'); };
        document.getElementById('musicMinimize').onclick = function(e) { e.stopPropagation(); if (window.innerWidth <= 640) musicPlayer.classList.remove('expanded'); else musicPlayer.style.display = 'none'; };
        function toggleMusicPlayer() { if (window.innerWidth <= 640) musicPlayer.classList.toggle('expanded'); else musicPlayer.style.display = musicPlayer.style.display === 'none' ? 'block' : 'none'; }
        audio.ontimeupdate = function() { if (audio.duration) { progressSlider.value = audio.currentTime / audio.duration; timeDisplay.textContent = formatTime(audio.currentTime) + ' / ' + formatTime(audio.duration); } };
        audio.onloadedmetadata = function() { timeDisplay.textContent = "0:00 / " + formatTime(audio.duration); };
        progressSlider.oninput = function() { if (audio.duration) audio.currentTime = parseFloat(this.value) * audio.duration; };

        // ================= 启动 =================
        window.onload = function() {
            loadImages(); initMoments(); loadMessages(); updateMoodBar(getStore('lishen_last_mood') || '平静');
            var last = getStore('last_chat_time');
            if (!last || (Date.now() - parseInt(last) > 10 * 60 * 1000)) addMessage('你来了。我一直在等你。', 'bot', true);

            var layer = document.getElementById('snowLayer');
            if (layer) {
                var flakes = ['❄', '❅', '❆', '✦'];
                for (var i = 0; i < 40; i++) {
                    var el = document.createElement('span'); el.className = 'flake'; el.textContent = flakes[Math.floor(Math.random() * 4)];
                    el.style.fontSize = (8 + Math.random() * 16) + 'px'; el.style.left = Math.random() * 100 + '%';
                    el.style.opacity = 0.3 + Math.random() * 0.5; el.style.animationDuration = (14 + Math.random() * 22) + 's'; el.style.animationDelay = Math.random() * 20 + 's';
                    layer.appendChild(el);
                }
            }

            var pet = document.getElementById('desktopPet'), container = document.querySelector('.chat-container');
            if (pet && container) {
                var rect = container.getBoundingClientRect();
                pet.style.left = (rect.right - 220) + 'px'; pet.style.top = (rect.bottom - 220) + 'px';
                makeDraggable(pet);
            }
            makeDraggable(musicPlayer);
            
            document.getElementById('momentsEntryBtn').onclick = openMoments;
            document.getElementById('sendButton').onclick = sendMessage;
            document.getElementById('userInput').onkeydown = function(e) { if (e.key === 'Enter') sendMessage(); };
        };
    </script>
</body>
</html>
