<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>💙 与他的邂逅</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Georgia', 'PingFang SC', serif; height: 100vh; display: flex; justify-content: center; align-items: flex-start; padding-top: 4vh;
            background: url('images/bg.jpg') no-repeat center center fixed; background-size: cover; transition: all 0.5s ease; margin: 0; position: relative; overflow: hidden;
        }
        
        /* ===== 聊天容器 ===== */
        .chat-container {
            width: 580px; height: 740px; max-width: 94vw; max-height: 85vh; background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
            border-radius: 40px; box-shadow: 0 30px 80px rgba(0,0,0,0.35); display: flex; flex-direction: column; overflow: hidden; border: 1px solid rgba(255,255,255,0.15); position: relative; z-index: 10; transition: all 0.4s ease; margin: 0 auto;
        }
        
        /* ===== 头部 ===== */
        .chat-nav { display: flex; align-items: center; padding: 14px 20px 10px 20px; border-bottom: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.04); flex-shrink: 0; gap: 12px; }
        .nav-avatar { width: 40px; height: 40px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.6); flex-shrink: 0; background: #dbeafe; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #0a1a2e; overflow: hidden; }
        .nav-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .nav-info { flex: 1; }
        .nav-name { font-size: 17px; font-weight: 500; color: #0a1a2e; }
        .nav-status { font-size: 12px; color: #0a1a2e; opacity: 0.75; display: flex; align-items: center; gap: 6px; margin-top: 2px; }
        .nav-status .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #43a047; flex-shrink: 0; transition: background 0.4s, box-shadow 0.4s; }
        .nav-menu { background: none; border: none; color: #0a1a2e; font-size: 18px; cursor: pointer; opacity: 0.5; padding: 4px 8px; }
        
        /* ===== 聊天区域 ===== */
        .chat-messages { flex: 1; padding: 16px 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth; }
        .chat-messages::-webkit-scrollbar { width: 4px; }
        .chat-messages::-webkit-scrollbar-thumb { background: rgba(44, 62, 80, 0.2); border-radius: 10px; }
        
        .message-wrapper { display: flex; align-items: flex-end; gap: 12px; margin-bottom: 4px; animation: messageSlideIn 0.35s ease-out; }
        @keyframes messageSlideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .message-wrapper.user { justify-content: flex-end; }
        .message-wrapper.user .avatar { order: 1; }
        .avatar { width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0; background: #dbeafe; display: flex; align-items: center; justify-content: center; font-size: 20px; color: #0a1a2e; border: 2px solid rgba(255,255,255,0.6); overflow: hidden; }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        
        .message { padding: 14px 20px; border-radius: 20px; max-width: 76%; word-wrap: break-word; line-height: 1.6; font-size: 16px; position: relative; }
        .message.user { background: linear-gradient(135deg, #d8eeff 0%, #a4c9f0 45%, #c3e2f8 100%); color: #0a1a2e; border-bottom-right-radius: 4px; border: 1px solid rgba(255,255,255,0.35); }
        .message.bot { background: rgba(255, 255, 255, 0.95); color: #0a1a2e; border-bottom-left-radius: 4px; border: 1px solid rgba(255,255,255,0.5); }
        .message .time { font-size: 10px; opacity: 0.35; margin-left: 8px; display: inline-block; color: #0a1a2e; }
        
        /* 打字机指示器 */
        .typing-indicator { align-self: flex-start; display: flex; align-items: center; gap: 4px; padding: 14px 20px; border-radius: 20px; border-bottom-left-radius: 4px; background: rgba(255, 255, 255, 0.95); margin-bottom: 4px; }
        .typing-indicator span { width: 6px; height: 6px; background: #5a7a9a; border-radius: 50%; animation: typingBounce 1.2s ease-in-out infinite; }
        .typing-indicator span:nth-child(2) { animation-delay: 0.15s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.3s; }
        @keyframes typingBounce { 0%, 100% { opacity: 0.3; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-3px); } }

        /* ===== 输入区 ===== */
        .chat-input-area { display: flex; padding: 10px 16px 14px 16px; background: rgba(255,255,255,0.04); border-top: 1px solid rgba(255,255,255,0.06); gap: 10px; align-items: center; }
        .chat-input-area input { flex: 1; padding: 10px 18px; border: 1px solid rgba(255,255,255,0.2); border-radius: 24px; background: rgba(255,255,255,0.25); outline: none; font-size: 15px; color: #0a1a2e; min-height: 44px; }
        .chat-input-area button { padding: 10px 22px; background: #3b82f6; color: white; border: none; border-radius: 24px; font-size: 15px; cursor: pointer; font-weight: 500; flex-shrink: 0; min-height: 44px; }

        /* ===== 夜间模式 ===== */
        body.night-mode .chat-container { background: rgba(0, 0, 0, 0.65); border-color: rgba(255,255,255,0.08); }
        body.night-mode .nav-name { color: #e8f0fe; }
        body.night-mode .nav-status { color: #b0c4de; }
        body.night-mode .nav-menu { color: #c8d6e5; }
        body.night-mode .message.user { background: #1e3a5f; color: #eef6ff; }
        body.night-mode .message.bot { background: rgba(255, 255, 255, 0.92); color: #0a1a2e; }
        body.night-mode .chat-input-area input { background: rgba(255,255,255,0.08); color: #e8f0fe; }
        body.night-mode .chat-input-area button { background: #1e3a5f; }
        body.night-mode .typing-indicator { background: rgba(30, 50, 80, 0.6); }
        body.night-mode .typing-indicator span { background: #b0c4de; }

        .date-divider { text-align: center; font-size: 12px; color: rgba(10, 26, 46, 0.4); padding: 12px 0 8px 0; }
        
        /* ===== 下拉菜单 ===== */
        .dropdown-menu { position: fixed; background: rgba(255,255,255,0.95); border-radius: 16px; padding: 8px 0; min-width: 160px; z-index: 9999; display: none; border: 1px solid rgba(0,0,0,0.1); }
        .dropdown-menu.show { display: block; }
        .dropdown-menu .menu-item { padding: 10px 20px; font-size: 14px; color: #0a1a2e; border: none; background: none; width: 100%; text-align: left; cursor: pointer; }
        .dropdown-menu .menu-item:hover { background: rgba(0,0,0,0.05); }

        /* ===== 桌面宠物 ===== */
        .desktop-pet { position: fixed; z-index: 999; width: 240px; height: 240px; border-radius: 50%; cursor: grab; background: transparent; display: flex; align-items: center; justify-content: center; user-select: none; }
        .desktop-pet:active { cursor: grabbing; }
        .desktop-pet img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; display: block; pointer-events: none; }
        .desktop-pet .pet-placeholder { font-size: 100px; color: #0a1a2e; opacity: 0.2; font-weight: 300; display: none; }
        .pet-bubble { position: absolute; bottom: calc(100% + 16px); left: 50%; transform: translateX(-50%); background: rgba(255,255,255,0.85); backdrop-filter: blur(12px); border-radius: 16px; padding: 10px 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.12); font-size: 16px; color: #0a1a2e; max-width: 200px; border: 1px solid rgba(255,255,255,0.3); opacity: 0; transition: opacity 0.3s ease; pointer-events: none; white-space: nowrap; text-align: center; }
        .pet-bubble.show { opacity: 1; }
        .pet-bubble::after { content: ''; position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%); border-left: 10px solid transparent; border-right: 10px solid transparent; border-top: 10px solid rgba(255,255,255,0.85); }

        /* ===== 冰雪特效 ===== */
        .snow-layer { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 998; overflow: hidden; }
        .snow-layer .flake { position: absolute; top: -30px; color: rgba(235, 246, 255, 0.85); filter: drop-shadow(0 0 4px rgba(200, 235, 255, 0.6)); animation: snowFall linear infinite; }
        @keyframes snowFall { 0% { transform: translateY(-6vh) translateX(0) rotate(0deg); opacity: 0; } 8% { opacity: 1; } 50% { transform: translateY(50vh) translateX(4vw) rotate(180deg); } 92% { opacity: 1; } 100% { transform: translateY(106vh) translateX(-2vw) rotate(360deg); opacity: 0; } }
        
        .aurora-layer { position: fixed; top: 0; left: 0; width: 100vw; height: 60vh; pointer-events: none; z-index: 1; opacity: 0; transition: opacity 2s ease; }
        .aurora-layer.show { opacity: 1; }
        .aurora-band { position: absolute; top: -10%; left: -20%; width: 140%; height: 65%; border-radius: 50%; filter: blur(60px); mix-blend-mode: screen; }
        .aurora-band.a1 { background: linear-gradient(90deg, transparent, rgba(110, 220, 190, 0.16), rgba(140, 190, 255, 0.12), transparent); animation: auroraShift1 12s ease-in-out infinite alternate; }
        .aurora-band.a2 { background: linear-gradient(90deg, transparent, rgba(150, 170, 255, 0.12), rgba(120, 230, 200, 0.14), transparent); animation: auroraShift2 16s ease-in-out infinite alternate; top: -4%; }
        @keyframes auroraShift1 { 0% { transform: translateX(-6%) skewX(-8deg) scaleY(1); opacity: 0.7; } 50% { transform: translateX(3%) skewX(-4deg) scaleY(1.15); opacity: 1; } 100% { transform: translateX(8%) skewX(-10deg) scaleY(0.9); opacity: 0.75; } }
        @keyframes auroraShift2 { 0% { transform: translateX(5%) skewX(6deg) scaleY(1.1); opacity: 0.6; } 50% { transform: translateX(-3%) skewX(10deg) scaleY(0.95); opacity: 0.9; } 100% { transform: translateX(-8%) skewX(4deg) scaleY(1.2); opacity: 0.7; } }

        /* ===== 移动端适配 ===== */
        @media (max-width: 640px) {
            body { padding-top: 0; align-items: stretch; }
            .chat-container { width: 100%; height: 100dvh; max-height: 100dvh; border-radius: 0; margin: 0; }
            .message { max-width: 82% !important; }
            .chat-input-area input, .chat-input-area button { min-height: 38px; font-size: 14px; }
            .desktop-pet { width: 70px; height: 70px; bottom: 110px !important; left: 10px !important; top: auto !important; right: auto !important; }
        }
    </style>
</head>
<body>
    <!-- 特效层 -->
    <div class="aurora-layer" id="auroraLayer"><div class="aurora-band a1"></div><div class="aurora-band a2"></div></div>
    <div class="snow-layer" id="snowLayer"></div>

    <div class="chat-container">
        <div class="chat-nav">
            <div class="nav-avatar">
                <img src="images/lishen.png" alt="黎深" onerror="this.style.display='none'; this.parentElement.textContent='❄️';">
            </div>
            <div class="nav-info">
                <div class="nav-name">黎深</div>
                <div class="nav-status">
                    <span class="dot" id="moodDot"></span>
                    <span id="moodText">在线 · 平静</span>
                </div>
            </div>
            <button class="nav-menu" id="menuBtn">☰</button>
        </div>

        <div class="chat-messages" id="chatMessages"></div>

        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="输入你想说的话...">
            <button id="sendButton">发送</button>
        </div>
    </div>

    <!-- 桌面宠物 -->
    <div class="desktop-pet" id="desktopPet">
        <img src="images/lishen_q.png" alt="黎深Q版" id="petImage" onerror="this.style.display='none'; document.getElementById('petPlaceholder').style.display='flex';">
        <div class="pet-placeholder" id="petPlaceholder">黎</div>
        <div class="pet-bubble" id="petBubble"></div>
    </div>

    <!-- 菜单 -->
    <div class="dropdown-menu" id="dropdownMenu">
        <button class="menu-item" onclick="clearAllMessages()">清空对话</button>
        <button class="menu-item" onclick="toggleTheme()">切换夜间模式</button>
    </div>

    <script>
        // ================= 纯基础语法，保证所有手机兼容 =================
        var API_URL = '/api/chat';
        var MODEL_NAME = 'qwen-plus';
        var CHARACTER_PROMPT = "你叫黎深，男、27岁，Akso医院心脏外科主任医师。年上稳重熟男，处事极度沉稳。你在和一个你喜欢的女孩面对面聊天。对话控制在40字以内。用'你'或者'宝宝'称呼她。只说你会当面说出口的话，不要描述动作或表情。绝不使用'哦、呀、呢、啦'等语气词。\n\n【系统强制输出要求，必须绝对遵守】\n无论你回复什么，回复的第一句必须且只能以 [mood:情绪词] 开头！\n例如：[mood:想念] 我也想你，早点休息。\n情绪词必须从这六个词里选：平静、愉悦、担忧、疲惫、想念、吃醋。\n如果缺少 [mood:情绪词] 这个开头，系统将判定你回复失败。";

        var chatMessages = document.getElementById('chatMessages');
        var userInput = document.getElementById('userInput');
        var sendButton = document.getElementById('sendButton');
        var messageIdCounter = 0;
        var lastDate = '';

        var MOOD_MAP = {
            '平静': { color: '#43a047' }, '愉悦': { color: '#f5a623' }, '担忧': { color: '#c9a227' },
            '疲惫': { color: '#8a8f99' }, '想念': { color: '#e08fb0' }, '吃醋': { color: '#d96a6a' }
        };

        function getStore(key) { try { return localStorage.getItem(key); } catch(e) { return null; } }
        function setStore(key, val) { try { localStorage.setItem(key, val); } catch(e) {} }
        function removeStore(key) { try { localStorage.removeItem(key); } catch(e) {} }

        function extractMood(raw) {
            if (!raw) return { text: '', mood: null };
            var m = raw.match(/\[mood\s*[:：]\s*([^\]]+?)\s*\]/i);
            if (!m) return { text: raw.trim(), mood: null };
            var moodRaw = m[1].trim();
            var text = raw.replace(m[0], '').trim();
            return { text: text, mood: MOOD_MAP[moodRaw] ? moodRaw : null };
        }

        function updateMoodBar(mood) {
            var dot = document.getElementById('moodDot');
            var txt = document.getElementById('moodText');
            if (!dot || !txt) return;
            var finalMood = (mood && MOOD_MAP[mood]) ? mood : '平静';
            var cfg = MOOD_MAP[finalMood];
            dot.style.background = cfg.color;
            txt.textContent = '在线 · ' + finalMood;
            txt.style.color = cfg.color;
            setStore('lishen_last_mood', finalMood);
        }

        function getTimeString() {
            var d = new Date();
            return d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
        }

        function appendDateDivider() {
            var d = new Date();
            var key = d.toDateString();
            if (key !== lastDate) {
                lastDate = key;
                var div = document.createElement('div');
                div.className = 'date-divider';
                div.textContent = '今天';
                chatMessages.appendChild(div);
            }
        }

        function createAvatar(sender) {
            var img = document.createElement('img');
            img.className = 'avatar';
            img.src = sender === 'user' ? 'images/user.png' : 'images/lishen.png';
            img.onerror = function() {
                this.style.display = 'none';
                var div = document.createElement('div');
                div.className = 'avatar';
                div.textContent = sender === 'user' ? '👤' : '❄️';
                this.parentNode.insertBefore(div, this);
            };
            return img;
        }

        function addMessage(text, sender, typing) {
            var container = document.createElement('div');
            container.className = 'message-wrapper ' + sender;
            var msgId = 'msg-' + (++messageIdCounter) + '-' + Date.now();
            container.dataset.id = msgId;
            container.dataset.ts = Date.now();
            appendDateDivider();
            var avatar = createAvatar(sender);
            var div = document.createElement('div');
            div.className = 'message ' + sender;
            var contentSpan = document.createElement('span');
            contentSpan.className = 'message-text';
            var timeSpan = document.createElement('span');
            timeSpan.className = 'time';
            timeSpan.textContent = getTimeString();
            
            div.appendChild(contentSpan);
            div.appendChild(timeSpan);
            container.appendChild(avatar);
            container.appendChild(div);
            chatMessages.appendChild(container);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            if (typing && sender === 'bot') {
                var index = 0;
                contentSpan.textContent = '';
                var interval = setInterval(function() {
                    if (index < text.length) {
                        contentSpan.textContent += text.charAt(index);
                        chatMessages.scrollTop = chatMessages.scrollHeight;
                        index++;
                    } else {
                        clearInterval(interval);
                        saveMessages();
                    }
                }, 20);
            } else {
                contentSpan.textContent = text;
                saveMessages();
            }
        }

        function saveMessages() {
            var items = [];
            var wrappers = document.querySelectorAll('.message-wrapper');
            for (var i = 0; i < wrappers.length; i++) {
                var el = wrappers[i];
                var textSpan = el.querySelector('.message-text');
                items.push({
                    id: el.dataset.id,
                    ts: el.dataset.ts,
                    sender: el.className.indexOf('user') > -1 ? 'user' : 'bot',
                    text: textSpan ? textSpan.textContent : ''
                });
            }
            setStore('chatHistory', JSON.stringify(items));
        }

        function loadMessages() {
            var saved = getStore('chatHistory');
            if (!saved) return;
            try {
                var msgs = JSON.parse(saved);
                if (!msgs.length) return;
                lastDate = '';
                for (var i = 0; i < msgs.length; i++) {
                    var msg = msgs[i];
                    var container = document.createElement('div');
                    container.className = 'message-wrapper ' + msg.sender;
                    container.dataset.id = msg.id;
                    container.dataset.ts = msg.ts;
                    appendDateDivider();
                    var avatar = createAvatar(msg.sender);
                    var div = document.createElement('div');
                    div.className = 'message ' + msg.sender;
                    var contentSpan = document.createElement('span');
                    contentSpan.className = 'message-text';
                    contentSpan.textContent = msg.text;
                    var timeSpan = document.createElement('span');
                    timeSpan.className = 'time';
                    timeSpan.textContent = '--:--';
                    div.appendChild(contentSpan);
                    div.appendChild(timeSpan);
                    container.appendChild(avatar);
                    container.appendChild(div);
                    chatMessages.appendChild(container);
                }
                chatMessages.scrollTop = chatMessages.scrollHeight;
            } catch(e) {}
        }

        function clearAllMessages() {
            if (!confirm('确定清空记录吗？')) return;
            document.querySelectorAll('.message-wrapper').forEach(function(el){ el.remove(); });
            document.querySelectorAll('.date-divider').forEach(function(el){ el.remove(); });
            removeStore('chatHistory');
            lastDate = '';
            updateMoodBar('平静');
            addMessage('你来了。我一直在等你。', 'bot', true);
        }

        function sendMessage() {
            var msg = userInput.value.trim();
            if (!msg) return;
            addMessage(msg, 'user', false);
            userInput.value = '';
            setStore('last_chat_time', Date.now().toString());

            var typing = document.createElement('div');
            typing.className = 'typing-indicator';
            typing.innerHTML = '<span></span><span></span><span></span>';
            chatMessages.appendChild(typing);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            var history = [];
            document.querySelectorAll('.message-wrapper').forEach(function(el) {
                var s = el.classList.contains('user') ? 'user' : 'assistant';
                var t = el.querySelector('.message-text');
                if (t && t.textContent) history.push({ role: s, content: t.textContent });
            });
            var messages = [{ role: 'system', content: CHARACTER_PROMPT }].concat(history.slice(-20));

            fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ model: MODEL_NAME, messages: messages, temperature: 0.7, max_tokens: 200 })
            }).then(function(res) {
                if (!res.ok) throw new Error('HTTP ' + res.status);
                return res.json();
            }).then(function(data) {
                typing.remove();
                var raw = (data.choices && data.choices[0] && data.choices[0].message) ? data.choices[0].message.content : '...';
                var parsed = extractMood(raw);
                addMessage(parsed.text, 'bot', true);
                if (parsed.mood) updateMoodBar(parsed.mood);
            }).catch(function(err) {
                typing.remove();
                addMessage('黎深皱了皱眉："信号不太好……"', 'bot', false);
            });
        }

        sendButton.onclick = sendMessage;
        userInput.onkeydown = function(e) { if (e.key === 'Enter') sendMessage(); };

        function toggleTheme() { document.body.classList.toggle('night-mode'); }

        var menuBtn = document.getElementById('menuBtn');
        var dropdown = document.getElementById('dropdownMenu');
        menuBtn.onclick = function(e) {
            e.stopPropagation();
            dropdown.style.left = (menuBtn.getBoundingClientRect().left - 100) + 'px';
            dropdown.style.top = (menuBtn.getBoundingClientRect().bottom + 10) + 'px';
            dropdown.classList.toggle('show');
        };
        document.addEventListener('click', function() { dropdown.classList.remove('show'); });

        // ================= 特效与拖拽逻辑 =================
        function initEffects() {
            // 1. 雪花特效
            var layer = document.getElementById('snowLayer');
            if (layer) {
                var flakes = ['❄', '❅', '❆', '✦'];
                var count = window.innerWidth < 640 ? 40 : 80;
                for (var i = 0; i < count; i++) {
                    var el = document.createElement('span');
                    el.className = 'flake';
                    el.textContent = flakes[Math.floor(Math.random() * flakes.length)];
                    var size = 8 + Math.random() * 16;
                    el.style.fontSize = size + 'px';
                    el.style.left = Math.random() * 100 + '%';
                    el.style.opacity = 0.3 + Math.random() * 0.4;
                    el.style.animationDuration = (14 + Math.random() * 22) + 's';
                    el.style.animationDelay = Math.random() * 20 + 's';
                    layer.appendChild(el);
                }
            }

            // 2. 极光渐入
            var aurora = document.getElementById('auroraLayer');
            if (aurora) {
                setTimeout(function() { aurora.classList.add('show'); }, 800);
            }

            // 3. 桌面宠物控制
            var pet = document.getElementById('desktopPet');
            var bubble = document.getElementById('petBubble');
            if (pet && bubble) {
                var quotes = ['又在发呆？', '嗯，我在。', '手凉不凉？', '今天手术顺利。', '想听冷笑话吗？', '你来了。', '别熬夜。', '雪很大，记得加衣。', '……我在呢。'];
                var bubbleTimeout = null;
                pet.onclick = function(e) {
                    if (pet._wasDragged) { pet._wasDragged = false; return; }
                    e.stopPropagation();
                    bubble.textContent = quotes[Math.floor(Math.random() * quotes.length)];
                    bubble.classList.add('show');
                    clearTimeout(bubbleTimeout);
                    bubbleTimeout = setTimeout(function() { bubble.classList.remove('show'); }, 2500);
                };
                window.addEventListener('load', function () {
                    var c = document.querySelector('.chat-container');
                    if (c) {
                        var rect = c.getBoundingClientRect();
                        pet.style.left = (rect.right - 260) + 'px';
                        pet.style.top = (rect.bottom - 260) + 'px';
                    }
                });
            }

            // 4. 拖拽功能
            function makeDraggable(element) {
                if (!element) return;
                var isDragging = false, startX = 0, startY = 0, origX = 0, origY = 0;
                element.addEventListener('dragstart', function(e) { e.preventDefault(); });
                element.addEventListener('selectstart', function(e) { e.preventDefault(); });
                
                element.addEventListener('pointerdown', function (e) {
                    if (e.target.closest('button, input')) return;
                    if (e.pointerType === 'mouse' && e.button !== 0) return;
                    isDragging = true;
                    var rect = element.getBoundingClientRect();
                    startX = e.clientX; startY = e.clientY; origX = rect.left; origY = rect.top;
                    element.style.cursor = 'grabbing';
                    element._dragStartX = e.clientX; element._dragStartY = e.clientY; element._wasDragged = false;
                    try { element.setPointerCapture(e.pointerId); } catch (_) {}
                    e.preventDefault();
                });
                
                element.addEventListener('pointermove', function (e) {
                    if (!isDragging) return;
                    var dx = e.clientX - startX, dy = e.clientY - startY;
                    if (Math.abs(e.clientX - element._dragStartX) + Math.abs(e.clientY - element._dragStartY) > 5) element._wasDragged = true;
                    element.style.position = 'fixed';
                    element.style.left = (origX + dx) + 'px';
                    element.style.top = (origY + dy) + 'px';
                    element.style.bottom = 'auto'; element.style.right = 'auto';
                });
                
                function endDrag(e) {
                    if (!isDragging) return;
                    isDragging = false;
                    element.style.cursor = 'grab';
                    try { element.releasePointerCapture(e.pointerId); } catch (_) {}
                }
                element.addEventListener('pointerup', endDrag);
                element.addEventListener('pointercancel', endDrag);
            }
            makeDraggable(document.getElementById('desktopPet'));
        }

        // 初始化
        window.onload = function() {
            initEffects();
            loadMessages();
            updateMoodBar(getStore('lishen_last_mood') || '平静');
            var last = getStore('last_chat_time');
            if (!last || (Date.now() - parseInt(last) > 10 * 60 * 1000)) {
                addMessage('你来了。我一直在等你。', 'bot', true);
            }
        };
    </script>
</body>
