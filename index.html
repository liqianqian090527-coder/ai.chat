<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>💙 与他的邂逅</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        /* ===== 核心调色板：明亮晴空蓝 ===== */
        :root {
            --primary: #4a90e2;
            --primary-light: #89bff8;
            --primary-dark: #2c6cb0;
            --glass-bg: rgba(255, 255, 255, 0.65);
            --glass-border: rgba(255, 255, 255, 0.8);
            --text-main: #1a2a3a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Georgia', 'PingFang SC', serif; height: 100vh; display: flex; justify-content: center; align-items: flex-start; padding-top: 4vh;
            background: #e6f2ff; background-size: cover; background-position: center; background-repeat: no-repeat;
            transition: background 0.5s ease; margin: 0; position: relative; overflow: hidden;
        }

        /* ===== 特效层 ===== */
        .snow-layer { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 998; overflow: hidden; }
        .snow-layer .flake { position: absolute; top: -30px; color: rgba(255, 255, 255, 0.9); filter: drop-shadow(0 0 4px rgba(180, 220, 255, 0.8)); animation: snowFall linear infinite; }
        @keyframes snowFall { 0% { transform: translateY(-6vh) translateX(0) rotate(0deg); opacity: 0; } 8% { opacity: 1; } 50% { transform: translateY(50vh) translateX(4vw) rotate(180deg); } 92% { opacity: 1; } 100% { transform: translateY(106vh) translateX(-2vw) rotate(360deg); opacity: 0; } }
        
        .aurora-layer { position: fixed; top: 0; left: 0; width: 100vw; height: 60vh; pointer-events: none; z-index: 1; opacity: 0; transition: opacity 2s ease; }
        .aurora-layer.show { opacity: 1; }
        .aurora-band { position: absolute; top: -10%; left: -20%; width: 140%; height: 65%; border-radius: 50%; filter: blur(60px); mix-blend-mode: screen; }
        .aurora-band.a1 { background: linear-gradient(90deg, transparent, rgba(110, 220, 255, 0.2), rgba(140, 190, 255, 0.15), transparent); animation: auroraShift1 12s ease-in-out infinite alternate; }
        .aurora-band.a2 { background: linear-gradient(90deg, transparent, rgba(150, 200, 255, 0.15), rgba(120, 230, 255, 0.2), transparent); animation: auroraShift2 16s ease-in-out infinite alternate; top: -4%; }
        @keyframes auroraShift1 { 0% { transform: translateX(-6%) skewX(-8deg) scaleY(1); opacity: 0.7; } 50% { transform: translateX(3%) skewX(-4deg) scaleY(1.15); opacity: 1; } 100% { transform: translateX(8%) skewX(-10deg) scaleY(0.9); opacity: 0.75; } }
        @keyframes auroraShift2 { 0% { transform: translateX(5%) skewX(6deg) scaleY(1.1); opacity: 0.6; } 50% { transform: translateX(-3%) skewX(10deg) scaleY(0.95); opacity: 0.9; } 100% { transform: translateX(-8%) skewX(4deg) scaleY(1.2); opacity: 0.7; } }

        /* ===== 聊天容器 ===== */
        .chat-container {
            width: 600px; height: 800px; max-width: 94vw; max-height: 88vh; 
            background: var(--glass-bg); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            border-radius: 32px; box-shadow: 0 20px 60px rgba(74, 144, 226, 0.15); display: flex; flex-direction: column; 
            overflow: hidden; border: 1px solid var(--glass-border); position: relative; z-index: 10; transition: all 0.4s ease; margin: 0 auto;
        }

        /* ===== 头部 ===== */
        .chat-nav { display: flex; align-items: center; padding: 16px 24px; border-bottom: 1px solid rgba(255,255,255,0.5); flex-shrink: 0; gap: 14px; background: rgba(255,255,255,0.3); }
        .nav-avatar { width: 44px; height: 44px; border-radius: 50%; border: 2px solid #fff; flex-shrink: 0; background: #dbeafe; display: flex; align-items: center; justify-content: center; font-size: 20px; color: var(--text-main); overflow: hidden; box-shadow: 0 4px 10px rgba(74,144,226,0.1); }
        .nav-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .nav-info { flex: 1; }
        .nav-name { font-size: 18px; font-weight: 600; color: var(--text-main); letter-spacing: 0.5px; }
        .nav-status { font-size: 13px; color: var(--text-main); opacity: 0.8; display: flex; align-items: center; gap: 6px; margin-top: 2px; }
        .nav-status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--primary); flex-shrink: 0; transition: background 0.4s; }
        .nav-menu { background: rgba(255,255,255,0.5); border: none; color: var(--text-main); font-size: 18px; cursor: pointer; padding: 8px 12px; border-radius: 12px; transition: 0.2s; }
        .nav-menu:hover { background: #fff; }

        /* ===== 聊天区 ===== */
        .chat-messages { flex: 1; padding: 20px 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
        .chat-messages::-webkit-scrollbar { width: 4px; }
        .chat-messages::-webkit-scrollbar-thumb { background: rgba(74,144,226,0.2); border-radius: 10px; }
        
        /* 日期分隔线 */
        .date-divider { text-align: center; font-size: 12px; color: rgba(26, 42, 58, 0.4); padding: 10px 0; font-weight: 500; }
        
        .message-wrapper { display: flex; align-items: flex-end; gap: 12px; margin-bottom: 6px; animation: messageSlideIn 0.35s ease-out; position: relative; }
        @keyframes messageSlideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .message-wrapper.user { justify-content: flex-end; }
        .message-wrapper.user .avatar { order: 1; }
        .avatar { width: 42px; height: 42px; border-radius: 50%; flex-shrink: 0; background: #fff; display: flex; align-items: center; justify-content: center; font-size: 20px; color: var(--text-main); border: 2px solid #fff; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        
        .message { padding: 14px 20px; border-radius: 22px; max-width: 76%; word-wrap: break-word; line-height: 1.6; font-size: 15px; position: relative; color: var(--text-main); box-shadow: 0 4px 15px rgba(0,0,0,0.03); cursor: pointer; }
        .message.user { background: linear-gradient(135deg, #c2e0ff 0%, #a4c9f0 100%); border-bottom-right-radius: 6px; border: 1px solid #fff; }
        .message.bot { background: rgba(255, 255, 255, 0.9); border-bottom-left-radius: 6px; border: 1px solid #fff; }
        .message .time { font-size: 10px; opacity: 0.4; margin-left: 8px; display: inline-block; }
        
        /* 单条删除按钮 */
        .delete-btn { position: absolute; top: -8px; width: 22px; height: 22px; background: #ff6b6b; color: #fff; border-radius: 50%; display: none; align-items: center; justify-content: center; font-size: 12px; cursor: pointer; box-shadow: 0 2px 8px rgba(255,107,107,0.4); z-index: 10; transition: 0.2s; }
        .message-wrapper.user .delete-btn { left: -8px; }
        .message-wrapper.bot .delete-btn { right: -8px; }
        .message:hover .delete-btn { display: flex; }
        /* 手机端点击气泡显示删除 */
        .message.active .delete-btn { display: flex; }

        .typing-indicator { align-self: flex-start; display: flex; align-items: center; gap: 4px; padding: 14px 20px; border-radius: 22px; border-bottom-left-radius: 6px; background: rgba(255, 255, 255, 0.9); margin-bottom: 6px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
        .typing-indicator span { width: 6px; height: 6px; background: var(--primary); border-radius: 50%; animation: typingBounce 1.2s ease-in-out infinite; }
        .typing-indicator span:nth-child(2) { animation-delay: 0.15s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.3s; }
        @keyframes typingBounce { 0%, 100% { opacity: 0.3; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-3px); } }

        /* ===== 输入区 ===== */
        .chat-input-area { display: flex; padding: 16px 24px; background: rgba(255,255,255,0.3); gap: 12px; align-items: center; border-top: 1px solid rgba(255,255,255,0.5); }
        .chat-input-area input { flex: 1; padding: 12px 20px; border: 1px solid rgba(255,255,255,0.8); border-radius: 24px; background: rgba(255,255,255,0.7); outline: none; font-size: 15px; color: var(--text-main); min-height: 46px; transition: 0.3s; box-shadow: inset 0 2px 5px rgba(0,0,0,0.02); }
        .chat-input-area input:focus { background: #fff; box-shadow: 0 0 0 3px rgba(74,144,226,0.15); }
        .chat-input-area button { padding: 0 24px; background: var(--primary); color: white; border: none; border-radius: 24px; font-size: 15px; cursor: pointer; font-weight: 600; flex-shrink: 0; min-height: 46px; transition: 0.2s; box-shadow: 0 4px 12px rgba(74,144,226,0.3); }
        .chat-input-area button:hover { background: var(--primary-dark); transform: translateY(-1px); }

        /* ===== 音乐播放器 (桌面端) ===== */
        .music-player { position: fixed; top: 30px; right: 30px; z-index: 999; width: 300px; background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(24px); border-radius: 24px; padding: 16px; border: 1px solid var(--glass-border); box-shadow: 0 15px 35px rgba(74,144,226,0.1); transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); user-select: none; cursor: grab; }
        .music-player:active { cursor: grabbing; }
        .music-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 10px; margin-bottom: 12px; border-bottom: 1px solid rgba(0,0,0,0.05); }
        .track-name { color: var(--text-main); font-size: 14px; font-weight: 600; }
        .minimize-btn { background: rgba(0,0,0,0.05); border: none; color: var(--text-main); cursor: pointer; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: 0.2s; font-size: 12px; }
        .minimize-btn:hover { background: rgba(0,0,0,0.1); }
        .music-body { display: flex; flex-direction: column; gap: 12px; align-items: center; }
        .record-disc { width: 70px; height: 70px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #4a5a6a, #1a2a3a); position: relative; animation: spin 10s linear infinite; animation-play-state: paused; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .record-disc.playing { animation-play-state: running; }
        .record-disc .center-label { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 22px; height: 22px; border-radius: 50%; background: var(--primary-light); display: flex; align-items: center; justify-content: center; font-size: 10px; color: #fff; }
        .music-controls { display: flex; align-items: center; gap: 10px; width: 100%; }
        .music-controls button { background: var(--primary); border: none; border-radius: 50%; width: 32px; height: 32px; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: 0.2s; }
        .music-controls button:hover { transform: scale(1.05); }
        .progress-slider { flex: 1; height: 4px; -webkit-appearance: none; background: rgba(74,144,226,0.15); border-radius: 4px; outline: none; }
        .progress-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: var(--primary); cursor: pointer; box-shadow: 0 2px 6px rgba(74,144,226,0.4); }
        .time-display { font-size: 11px; color: var(--text-main); opacity: 0.7; font-variant-numeric: tabular-nums; white-space: nowrap; margin-top: 4px; }

        /* ===== 自定义弹窗 (Modal) ===== */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.3); backdrop-filter: blur(4px); z-index: 10000; display: none; align-items: center; justify-content: center; }
        .modal-overlay.show { display: flex; }
        .modal-box { background: #fff; border-radius: 20px; padding: 24px; width: 300px; max-width: 90vw; box-shadow: 0 20px 50px rgba(0,0,0,0.15); text-align: center; animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
        @keyframes popIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        .modal-title { font-size: 17px; font-weight: 600; color: var(--text-main); margin-bottom: 10px; }
        .modal-desc { font-size: 13px; color: #666; margin-bottom: 20px; line-height: 1.5; }
        .modal-btns { display: flex; gap: 10px; }
        .modal-btn { flex: 1; padding: 10px 0; border: none; border-radius: 10px; font-size: 14px; cursor: pointer; font-weight: 500; transition: 0.2s; }
        .modal-btn.cancel { background: #f0f0f0; color: #666; }
        .modal-btn.confirm { background: var(--primary); color: #fff; }
        .modal-btn:hover { opacity: 0.8; }

        /* ===== 下拉菜单 (精致版) ===== */
        .dropdown-menu { position: fixed; background: rgba(255,255,255,0.95); backdrop-filter: blur(20px); border-radius: 12px; padding: 6px; min-width: 130px; z-index: 9999; display: none; border: 1px solid rgba(0,0,0,0.05); box-shadow: 0 8px 24px rgba(0,0,0,0.12); }
        .dropdown-menu.show { display: block; }
        .dropdown-menu .menu-item { padding: 9px 14px; font-size: 13px; color: var(--text-main); border: none; background: none; width: 100%; text-align: left; cursor: pointer; transition: 0.2s; border-radius: 8px; display: flex; align-items: center; gap: 8px; }
        .dropdown-menu .menu-item:hover { background: rgba(74,144,226,0.1); color: var(--primary); }

        /* ===== 桌面宠物 ===== */
        .desktop-pet { position: fixed; z-index: 999; width: 200px; height: 200px; border-radius: 50%; cursor: grab; display: flex; align-items: center; justify-content: center; user-select: none; touch-action: none; }
        .desktop-pet:active { cursor: grabbing; }
        .desktop-pet img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; display: block; pointer-events: none; }
        .desktop-pet .pet-placeholder { font-size: 100px; color: var(--text-main); opacity: 0.2; font-weight: 300; display: none; }
        .pet-bubble { position: absolute; bottom: calc(100% + 16px); left: 50%; transform: translateX(-50%); background: rgba(255,255,255,0.95); backdrop-filter: blur(12px); border-radius: 16px; padding: 10px 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); font-size: 14px; color: var(--text-main); max-width: 200px; border: 1px solid #fff; opacity: 0; transition: opacity 0.3s ease; pointer-events: none; white-space: nowrap; text-align: center; }
        .pet-bubble.show { opacity: 1; }
        .pet-bubble::after { content: ''; position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%); border-left: 10px solid transparent; border-right: 10px solid transparent; border-top: 10px solid rgba(255,255,255,0.95); }

        /* ===== 夜间模式 ===== */
        body.night-mode { background-color: #0f172a; }
        body.night-mode .chat-container { background: rgba(15, 23, 42, 0.7); border-color: rgba(255,255,255,0.1); }
        body.night-mode .chat-nav { background: rgba(255,255,255,0.05); border-bottom-color: rgba(255,255,255,0.05); }
        body.night-mode .nav-name, body.night-mode .nav-status { color: #e2e8f0; }
        body.night-mode .nav-menu { background: rgba(255,255,255,0.1); color: #fff; }
        body.night-mode .message.user { background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 100%); color: #fff; border-color: rgba(255,255,255,0.1); }
        body.night-mode .message.bot { background: rgba(30, 41, 59, 0.9); color: #e2e8f0; border-color: rgba(255,255,255,0.1); }
        body.night-mode .chat-input-area { background: rgba(255,255,255,0.05); }
        body.night-mode .chat-input-area input { background: rgba(255,255,255,0.1); color: #fff; border-color: rgba(255,255,255,0.1); }
        body.night-mode .music-player { background: rgba(15, 23, 42, 0.6); border-color: rgba(255,255,255,0.1); }
        body.night-mode .track-name { color: #fff; }
        body.night-mode .modal-box { background: #1e293b; }
        body.night-mode .modal-title { color: #fff; }
        body.night-mode .modal-btn.cancel { background: rgba(255,255,255,0.1); color: #ccc; }

        /* ===== 移动端适配 ===== */
        @media (max-width: 640px) {
            body { padding-top: 0; align-items: stretch; }
            .chat-container { width: 100%; height: 100dvh; max-height: 100dvh; border-radius: 0; margin: 0; border: none; }
            .message { max-width: 82% !important; padding: 12px 16px; }
            .chat-input-area { padding: 12px 16px; }
            .chat-input-area input, .chat-input-area button { min-height: 40px; font-size: 14px; }
            .desktop-pet { width: 80px; height: 80px; bottom: 100px !important; left: 10px !important; top: auto !important; right: auto !important; }
            
            /* 手机音乐播放器变成小圆圈悬浮球 */
            .music-player { top: 15px; right: 15px; width: 50px; height: 50px; padding: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 10000; background: rgba(255, 255, 255, 0.8); border: 1px solid rgba(74,144,226,0.2); box-shadow: 0 4px 15px rgba(74,144,226,0.2); transition: all 0.3s ease; overflow: hidden; }
            .music-player .music-header, .music-player .music-body { display: none !important; }
            
            /* 展开状态 */
            .music-player.expanded { width: 280px; height: auto; border-radius: 20px; padding: 15px; flex-direction: column; background: rgba(255,255,255,0.95); }
            .music-player.expanded .music-header { display: flex !important; width: 100%; }
            .music-player.expanded .music-body { display: flex !important; width: 100%; }
            
            .mobile-music-icon { display: flex; font-size: 20px; color: var(--primary); width: 100%; height: 100%; align-items: center; justify-content: center; }
            .music-player.expanded .mobile-music-icon { display: none; }
        }
        @media (min-width: 641px) { .mobile-music-icon { display: none; } }
    </style>
</head>
<body>
    <!-- 隐藏的图片上传控件 -->
    <input type="file" id="bgUpload" accept="image/*" style="display: none;">

    <!-- 特效层 -->
    <div class="aurora-layer" id="auroraLayer"><div class="aurora-band a1"></div><div class="aurora-band a2"></div></div>
    <div class="snow-layer" id="snowLayer"></div>

    <!-- 聊天主界面 -->
    <div class="chat-container">
        <div class="chat-nav">
            <div class="nav-avatar">
                <img src="images/lishen.png" alt="黎深" onerror="this.style.display='none'; this.parentElement.textContent='❄️';">
            </div>
            <div class="nav-info">
                <div class="nav-name">黎深</div>
                <div class="nav-status">
                    <span class="dot" id="moodDot"></span>
                    <span id="moodText">在线 · 平静</span>
                </div>
            </div>
            <button class="nav-menu" id="menuBtn"><i class="fas fa-bars"></i></button>
        </div>

        <div class="chat-messages" id="chatMessages"></div>

        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="输入你想说的话...">
            <button id="sendButton"><i class="fas fa-paper-plane"></i> 发送</button>
        </div>
    </div>

    <!-- 下拉菜单 -->
    <div class="dropdown-menu" id="dropdownMenu">
        <button class="menu-item" onclick="toggleMusicPlayer()"><i class="fas fa-music"></i> 显示音乐</button>
        <button class="menu-item" onclick="exportChat()"><i class="fas fa-download"></i> 导出对话</button>
        <button class="menu-item" onclick="askSearch()"><i class="fas fa-search"></i> 搜索</button>
        <button class="menu-item" onclick="triggerBgUpload()"><i class="fas fa-image"></i> 更换背景</button>
        <button class="menu-item" onclick="toggleTheme()"><i class="fas fa-moon"></i> 夜间模式</button>
        <button class="menu-item" onclick="promptClear()" style="color: #e74c3c;"><i class="fas fa-trash-alt"></i> 清空全部</button>
    </div>

    <!-- 自定义弹窗 -->
    <div class="modal-overlay" id="customModal">
        <div class="modal-box">
            <div class="modal-title" id="modalTitle">提示</div>
            <div class="modal-desc" id="modalDesc">确定要执行此操作吗？</div>
            <div class="modal-btns">
                <button class="modal-btn cancel" onclick="closeModal()">取消</button>
                <button class="modal-btn confirm" id="modalConfirmBtn">确定</button>
            </div>
        </div>
    </div>

    <!-- 音乐播放器 -->
    <div class="music-player" id="musicPlayer">
        <span class="mobile-music-icon" id="mobileMusicIcon"><i class="fas fa-music"></i></span>
        <div class="music-header">
            <span class="track-name" id="trackName">🎵 正在播放</span>
            <button class="minimize-btn" id="musicMinimize"><i class="fas fa-times"></i></button>
        </div>
        <div class="music-body">
            <div class="record-disc" id="recordDisc"><div class="center-label">♪</div></div>
            <div class="music-controls">
                <button id="musicToggle"><i class="fas fa-play"></i></button>
                <input type="range" class="progress-slider" id="progressSlider" min="0" max="1" step="0.001" value="0">
            </div>
            <div class="time-display" id="timeDisplay">0:00 / 0:00</div>
        </div>
    </div>

    <!-- 桌面宠物 -->
    <div class="desktop-pet" id="desktopPet">
        <img src="images/lishen_q.png" alt="黎深Q版" id="petImage" onerror="this.style.display='none'; document.getElementById('petPlaceholder').style.display='flex';">
        <div class="pet-placeholder" id="petPlaceholder">黎</div>
        <div class="pet-bubble" id="petBubble"></div>
    </div>

    <audio id="bgAudio" src="images/bg-music.mp3" loop preload="auto"></audio>

    <script>
        // ================= 核心逻辑 (ES5 兼容) =================
        var API_URL = '/api/chat';
        var MODEL_NAME = 'qwen-plus';
        var CHARACTER_PROMPT = "你叫黎深，男、27岁，Akso医院心脏外科主任医师。年上稳重熟男，处事极度沉稳。你在和一个你喜欢的女孩面对面聊天。对话控制在40字以内。用'你'或者'宝宝'称呼她。只说你会当面说出口的话，不要描述动作或表情。绝不使用'哦、呀、呢、啦'等语气词。\n\n【系统强制输出要求，必须绝对遵守】\n无论你回复什么，回复的第一句必须且只能以 [mood:情绪词] 开头！\n例如：[mood:想念] 我也想你，早点休息。\n情绪词必须从这六个词里选：平静、愉悦、担忧、疲惫、想念、吃醋。\n如果缺少 [mood:情绪词] 这个开头，系统将判定你回复失败。";

        var chatMessages = document.getElementById('chatMessages');
        var userInput = document.getElementById('userInput');
        var sendButton = document.getElementById('sendButton');
        var messageIdCounter = 0;
        var lastDate = '';

        // 情绪颜色：全部采用高级蓝调及柔和色系
        var MOOD_MAP = {
            '平静': { color: '#4a90e2' }, // 主题蓝
            '愉悦': { color: '#f5a623' }, // 暖橙
            '担忧': { color: '#9b59b6' }, // 紫
            '疲惫': { color: '#95a5a6' }, // 灰蓝
            '想念': { color: '#e84393' }, // 粉
            '吃醋': { color: '#e67e22' }  // 橘红
        };

        function getStore(key) { try { return localStorage.getItem(key); } catch(e) { return null; } }
        function setStore(key, val) { try { localStorage.setItem(key, val); } catch(e) {} }
        function removeStore(key) { try { localStorage.removeItem(key); } catch(e) {} }

        // ================= 日期与时间 =================
        function getTimeString() {
            var d = new Date();
            return d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
        }

        // 微信规则：今天、昨天、星期几、具体日期
        function formatDate(ts) {
            var now = new Date();
            var msgDate = new Date(ts);
            var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            var target = new Date(msgDate.getFullYear(), msgDate.getMonth(), msgDate.getDate());
            var diff = Math.floor((today - target) / (24 * 60 * 60 * 1000));

            if (diff === 0) return '今天';
            if (diff === 1) return '昨天';
            if (diff > 1 && diff < 7) {
                var weeks = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
                return weeks[msgDate.getDay()];
            }
            return (msgDate.getMonth() + 1) + '月' + msgDate.getDate() + '日';
        }

        function appendDateDivider(ts) {
            var key = new Date(ts).toDateString();
            if (key !== lastDate) {
                lastDate = key;
                var div = document.createElement('div');
                div.className = 'date-divider';
                div.textContent = formatDate(ts);
                chatMessages.appendChild(div);
            }
        }

        // ================= 情绪解析 =================
        function extractMood(raw) {
            if (!raw) return { text: '', mood: null };
            var m = raw.match(/\[mood\s*[:：]\s*([^\]]+?)\s*\]/i);
            if (!m) return { text: raw.trim(), mood: null };
            var moodRaw = m[1].trim();
            var text = raw.replace(m[0], '').trim();
            return { text: text, mood: MOOD_MAP[moodRaw] ? moodRaw : null };
        }

        function updateMoodBar(mood) {
            var dot = document.getElementById('moodDot');
            var txt = document.getElementById('moodText');
            if (!dot || !txt) return;
            var finalMood = (mood && MOOD_MAP[mood]) ? mood : '平静';
            var cfg = MOOD_MAP[finalMood];
            dot.style.background = cfg.color;
            txt.textContent = '在线 · ' + finalMood;
            txt.style.color = cfg.color;
            setStore('lishen_last_mood', finalMood);
        }

        // ================= 消息渲染 =================
        function createAvatar(sender) {
            var img = document.createElement('img');
            img.className = 'avatar';
            img.src = sender === 'user' ? 'images/user.png' : 'images/lishen.png';
            img.onerror = function() {
                this.style.display = 'none';
                var div = document.createElement('div');
                div.className = 'avatar';
                div.textContent = sender === 'user' ? '👤' : '❄️';
                this.parentNode.insertBefore(div, this);
            };
            return img;
        }

        function addMessage(text, sender, typing) {
            var ts = Date.now();
            var container = document.createElement('div');
            container.className = 'message-wrapper ' + sender;
            var msgId = 'msg-' + (++messageIdCounter) + '-' + ts;
            container.dataset.id = msgId;
            container.dataset.ts = ts;
            
            appendDateDivider(ts);
            
            var avatar = createAvatar(sender);
            var div = document.createElement('div');
            div.className = 'message ' + sender;
            
            // 单条删除按钮
            var delBtn = document.createElement('div');
            delBtn.className = 'delete-btn';
            delBtn.innerHTML = '✕';
            delBtn.onclick = function(e) {
                e.stopPropagation();
                deleteSingleMessage(msgId, container);
            };
            div.appendChild(delBtn);

            // 点击气泡显示删除按钮（移动端）
            div.onclick = function(e) {
                if (e.target === delBtn) return;
                // 先移除其他气泡的 active
                document.querySelectorAll('.message').forEach(function(m){ m.classList.remove('active'); });
                div.classList.add('active');
            };
            
            var contentSpan = document.createElement('span');
            contentSpan.className = 'message-text';
            var timeSpan = document.createElement('span');
            timeSpan.className = 'time';
            timeSpan.textContent = getTimeString();
            
            div.appendChild(contentSpan);
            div.appendChild(timeSpan);
            container.appendChild(avatar);
            container.appendChild(div);
            chatMessages.appendChild(container);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            if (typing && sender === 'bot') {
                var index = 0;
                contentSpan.textContent = '';
                var interval = setInterval(function() {
                    if (index < text.length) {
                        contentSpan.textContent += text.charAt(index);
                        chatMessages.scrollTop = chatMessages.scrollHeight;
                        index++;
                    } else {
                        clearInterval(interval);
                        saveMessages();
                    }
                }, 20);
            } else {
                contentSpan.textContent = text;
                saveMessages();
            }
        }

        function deleteSingleMessage(msgId, container) {
            showModal('删除消息', '确定要删除这条消息吗？', '删除', function() {
                container.remove();
                // 从本地存储中移除
                var saved = getStore('chatHistory');
                if (saved) {
                    try {
                        var msgs = JSON.parse(saved);
                        var newMsgs = msgs.filter(function(m){ return m.id !== msgId; });
                        setStore('chatHistory', JSON.stringify(newMsgs));
                    } catch(e){}
                }
                reorganizeDividers();
            });
        }

        function reorganizeDividers() {
            document.querySelectorAll('.date-divider').forEach(function(el){ el.remove(); });
            lastDate = '';
            document.querySelectorAll('.message-wrapper').forEach(function(wrapper) {
                var ts = parseInt(wrapper.dataset.ts) || Date.now();
                var key = new Date(ts).toDateString();
                if (key !== lastDate) {
                    lastDate = key;
                    var div = document.createElement('div');
                    div.className = 'date-divider';
                    div.textContent = formatDate(ts);
                    wrapper.parentNode.insertBefore(div, wrapper);
                }
            });
        }

        function saveMessages() {
            var items = [];
            document.querySelectorAll('.message-wrapper').forEach(function(el) {
                var textSpan = el.querySelector('.message-text');
                items.push({
                    id: el.dataset.id,
                    ts: parseInt(el.dataset.ts),
                    sender: el.classList.contains('user') ? 'user' : 'bot',
                    text: textSpan ? textSpan.textContent : ''
                });
            });
            setStore('chatHistory', JSON.stringify(items));
        }

        function loadMessages() {
            var saved = getStore('chatHistory');
            if (!saved) return;
            try {
                var msgs = JSON.parse(saved);
                if (!msgs.length) return;
                lastDate = '';
                for (var i = 0; i < msgs.length; i++) {
                    var msg = msgs[i];
                    var container = document.createElement('div');
                    container.className = 'message-wrapper ' + msg.sender;
                    container.dataset.id = msg.id;
                    container.dataset.ts = msg.ts;
                    appendDateDivider(msg.ts);
                    
                    var avatar = createAvatar(msg.sender);
                    var div = document.createElement('div');
                    div.className = 'message ' + msg.sender;
                    
                    var delBtn = document.createElement('div');
                    delBtn.className = 'delete-btn';
                    delBtn.innerHTML = '✕';
                    delBtn.onclick = function(e) {
                        e.stopPropagation();
                        deleteSingleMessage(this.parentNode.parentNode.dataset.id, this.parentNode.parentNode);
                    };
                    div.appendChild(delBtn);
                    
                    div.onclick = function(e) {
                        if (e.target.className === 'delete-btn') return;
                        document.querySelectorAll('.message').forEach(function(m){ m.classList.remove('active'); });
                        this.classList.add('active');
                    };

                    var contentSpan = document.createElement('span');
                    contentSpan.className = 'message-text';
                    contentSpan.textContent = msg.text;
                    var timeSpan = document.createElement('span');
                    timeSpan.className = 'time';
                    timeSpan.textContent = new Date(msg.ts).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
                    
                    div.appendChild(contentSpan);
                    div.appendChild(timeSpan);
                    container.appendChild(avatar);
                    container.appendChild(div);
                    chatMessages.appendChild(container);
                }
                chatMessages.scrollTop = chatMessages.scrollHeight;
            } catch(e) {}
        }

        // ================= 核心交互 =================
        function sendMessage() {
            var msg = userInput.value.trim();
            if (!msg) return;
            addMessage(msg, 'user', false);
            userInput.value = '';
            setStore('last_chat_time', Date.now().toString());

            var typing = document.createElement('div');
            typing.className = 'typing-indicator';
            typing.innerHTML = '<span></span><span></span><span></span>';
            chatMessages.appendChild(typing);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            var history = [];
            document.querySelectorAll('.message-wrapper').forEach(function(el) {
                var s = el.classList.contains('user') ? 'user' : 'assistant';
                var t = el.querySelector('.message-text');
                if (t && t.textContent) history.push({ role: s, content: t.textContent });
            });
            var messages = [{ role: 'system', content: CHARACTER_PROMPT }].concat(history.slice(-20));

            fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ model: MODEL_NAME, messages: messages, temperature: 0.7, max_tokens: 200 })
            }).then(function(res) {
                if (!res.ok) throw new Error('HTTP ' + res.status);
                return res.json();
            }).then(function(data) {
                typing.remove();
                var raw = (data.choices && data.choices[0] && data.choices[0].message) ? data.choices[0].message.content : '...';
                var parsed = extractMood(raw);
                addMessage(parsed.text, 'bot', true);
                if (parsed.mood) updateMoodBar(parsed.mood);
            }).catch(function(err) {
                typing.remove();
                addMessage('黎深皱了皱眉："信号不太好……"', 'bot', false);
            });
        }

        sendButton.onclick = sendMessage;
        userInput.onkeydown = function(e) { if (e.key === 'Enter') sendMessage(); };

        // ================= 弹窗控制 =================
        var modal = document.getElementById('customModal');
        var modalTitle = document.getElementById('modalTitle');
        var modalDesc = document.getElementById('modalDesc');
        var modalConfirmBtn = document.getElementById('modalConfirmBtn');
        var currentConfirmAction = null;

        function showModal(title, desc, btnText, callback) {
            modalTitle.textContent = title;
            modalDesc.textContent = desc;
            modalConfirmBtn.textContent = btnText;
            currentConfirmAction = callback;
            modal.classList.add('show');
        }
        function closeModal() { modal.classList.remove('show'); }
        modalConfirmBtn.onclick = function() {
            if (currentConfirmAction) currentConfirmAction();
            closeModal();
        };

        // ================= 菜单功能 =================
        function toggleTheme() { document.body.classList.toggle('night-mode'); }

        function askSearch() {
            var kw = prompt('搜索包含哪些字的消息：');
            if (kw) {
                var found = 0;
                document.querySelectorAll('.message-text').forEach(function(el) {
                    if (el.textContent.indexOf(kw) > -1) {
                        el.style.background = '#ffe58a';
                        el.style.color = '#333';
                        found++;
                    } else {
                        el.style.background = 'transparent';
                        el.style.color = '';
                    }
                });
                if (found === 0) showModal('未找到', '没有找到包含该词的消息。', '知道了', null);
            }
        }

        function exportChat() {
            var text = "";
            document.querySelectorAll('.message-wrapper').forEach(function(el) {
                var s = el.classList.contains('user') ? '我' : '黎深';
                var t = el.querySelector('.message-text');
                if (t) text += s + "：" + t.textContent + "\n\n";
            });
            var blob = new Blob([text], {type: "text/plain;charset=utf-8"});
            var a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "与黎深的对话.txt";
            a.click();
        }

        function promptClear() {
            showModal('清空对话', '确定要清空所有聊天记录吗？他可能会有些失落。', '清空', function() {
                document.querySelectorAll('.message-wrapper').forEach(function(el){ el.remove(); });
                document.querySelectorAll('.date-divider').forEach(function(el){ el.remove(); });
                removeStore('chatHistory');
                lastDate = '';
                updateMoodBar('平静');
                addMessage('你来了。我一直在等你。', 'bot', true);
            });
        }

        // ================= 自定义背景 =================
        var bgUpload = document.getElementById('bgUpload');
        function triggerBgUpload() { bgUpload.click(); }
        bgUpload.onchange = function(e) {
            var file = e.target.files[0];
            if (!file) return;
            var reader = new FileReader();
            reader.onload = function(evt) {
                var base64 = evt.target.result;
                document.body.style.backgroundImage = 'url(' + base64 + ')';
                setStore('custom_bg', base64);
            };
            reader.readAsDataURL(file);
        };
        function loadBackground() {
            var savedBg = getStore('custom_bg');
            if (savedBg) {
                document.body.style.backgroundImage = 'url(' + savedBg + ')';
            } else {
                document.body.style.backgroundImage = 'url(images/bg.jpg)';
            }
        }

        // ================= 音乐控制 =================
        var audio = document.getElementById('bgAudio');
        var recordDisc = document.getElementById('recordDisc');
        var desktopToggle = document.getElementById('musicToggle');
        var mobileIcon = document.getElementById('mobileMusicIcon');
        var musicPlayer = document.getElementById('musicPlayer');
        var progressSlider = document.getElementById('progressSlider');
        var timeDisplay = document.getElementById('timeDisplay');
        var isPlaying = false;

        function formatTime(seconds) {
            if (isNaN(seconds)) return "0:00";
            var m = Math.floor(seconds / 60);
            var s = Math.floor(seconds % 60);
            return m + ":" + (s < 10 ? '0' : '') + s;
        }

        function togglePlay() {
            if (audio.paused) { 
                audio.play().then(function(){ 
                    isPlaying = true; 
                    recordDisc.classList.add('playing'); 
                    if(desktopToggle) desktopToggle.innerHTML = '<i class="fas fa-pause"></i>'; 
                }).catch(function(){}); 
            } else { 
                audio.pause(); 
                isPlaying = false; 
                recordDisc.classList.remove('playing'); 
                if(desktopToggle) desktopToggle.innerHTML = '<i class="fas fa-play"></i>'; 
            }
        }
        
        desktopToggle.onclick = togglePlay;
        
        // 手机端展开/收起音乐播放器
        mobileIcon.onclick = function(e) {
            e.stopPropagation();
            musicPlayer.classList.toggle('expanded');
        };

        // 收起 / 关闭音乐
        document.getElementById('musicMinimize').onclick = function(e) {
            e.stopPropagation();
            if (window.innerWidth <= 640) {
                musicPlayer.classList.remove('expanded');
            } else {
                musicPlayer.style.display = 'none';
            }
        };

        // 菜单重新打开音乐
        function toggleMusicPlayer() {
            if (window.innerWidth <= 640) {
                musicPlayer.classList.toggle('expanded');
            } else {
                musicPlayer.style.display = musicPlayer.style.display === 'none' ? 'block' : 'none';
            }
        }

        // 进度条与时间显示
        audio.ontimeupdate = function() {
            if (audio.duration) {
                progressSlider.value = audio.currentTime / audio.duration;
                timeDisplay.textContent = formatTime(audio.currentTime) + ' / ' + formatTime(audio.duration);
            }
        };
        audio.onloadedmetadata = function() {
            timeDisplay.textContent = "0:00 / " + formatTime(audio.duration);
        };
        progressSlider.oninput = function() {
            if (audio.duration) audio.currentTime = parseFloat(this.value) * audio.duration;
        };

        // ================= 菜单面板 =================
        var menuBtn = document.getElementById('menuBtn');
        var dropdown = document.getElementById('dropdownMenu');
        menuBtn.onclick = function(e) {
            e.stopPropagation();
            var rect = menuBtn.getBoundingClientRect();
            dropdown.style.left = (rect.left + rect.width - 130) + 'px';
            dropdown.style.top = (rect.bottom + 10) + 'px';
            dropdown.classList.toggle('show');
        };
        document.addEventListener('click', function(e) { 
            if (!dropdown.contains(e.target) && e.target !== menuBtn) {
                dropdown.classList.remove('show'); 
            }
            // 点击其他地方隐藏气泡删除按钮
            if (!e.target.closest('.message')) {
                document.querySelectorAll('.message').forEach(function(m){ m.classList.remove('active'); });
            }
        });

        // ================= 特效与拖拽 =================
        function initEffects() {
            var layer = document.getElementById('snowLayer');
            if (layer) {
                var flakes = ['❄', '❅', '❆', '✦'];
                var count = window.innerWidth < 640 ? 30 : 60;
                for (var i = 0; i < count; i++) {
                    var el = document.createElement('span');
                    el.className = 'flake';
                    el.textContent = flakes[Math.floor(Math.random() * flakes.length)];
                    var size = 8 + Math.random() * 16;
                    el.style.fontSize = size + 'px';
                    el.style.left = Math.random() * 100 + '%';
                    el.style.opacity = 0.3 + Math.random() * 0.5;
                    el.style.animationDuration = (14 + Math.random() * 22) + 's';
                    el.style.animationDelay = Math.random() * 20 + 's';
                    layer.appendChild(el);
                }
            }
            var aurora = document.getElementById('auroraLayer');
            if (aurora) setTimeout(function() { aurora.classList.add('show'); }, 800);

            var pet = document.getElementById('desktopPet');
            var bubble = document.getElementById('petBubble');
            if (pet && bubble) {
                var quotes = ['又在发呆？', '嗯，我在。', '手凉不凉？', '今天手术顺利。', '想听冷笑话吗？', '你来了。', '别熬夜。', '雪很大，记得加衣。', '……我在呢。'];
                var bubbleTimeout = null;
                pet.onclick = function(e) {
                    if (pet._wasDragged) { pet._wasDragged = false; return; }
                    e.stopPropagation();
                    bubble.textContent = quotes[Math.floor(Math.random() * quotes.length)];
                    bubble.classList.add('show');
                    clearTimeout(bubbleTimeout);
                    bubbleTimeout = setTimeout(function() { bubble.classList.remove('show'); }, 2500);
                };
            }

            function makeDraggable(element) {
                if (!element) return;
                var isDragging = false, startX = 0, startY = 0, origX = 0, origY = 0;
                element.addEventListener('dragstart', function(e) { e.preventDefault(); });
                element.addEventListener('selectstart', function(e) { e.preventDefault(); });
                
                element.addEventListener('pointerdown', function (e) {
                    if (e.target.closest('button, input')) return;
                    if (e.pointerType === 'mouse' && e.button !== 0) return;
                    isDragging = true;
                    var rect = element.getBoundingClientRect();
                    startX = e.clientX; startY = e.clientY; origX = rect.left; origY = rect.top;
                    element.style.cursor = 'grabbing';
                    element._dragStartX = e.clientX; element._dragStartY = e.clientY; element._wasDragged = false;
                    try { element.setPointerCapture(e.pointerId); } catch (_) {}
                    e.preventDefault();
                });
                
                element.addEventListener('pointermove', function (e) {
                    if (!isDragging) return;
                    var dx = e.clientX - startX, dy = e.clientY - startY;
                    if (Math.abs(e.clientX - element._dragStartX) + Math.abs(e.clientY - element._dragStartY) > 5) element._wasDragged = true;
                    element.style.position = 'fixed';
                    element.style.left = (origX + dx) + 'px';
                    element.style.top = (origY + dy) + 'px';
                    element.style.bottom = 'auto'; element.style.right = 'auto';
                });
                
                function endDrag(e) {
                    if (!isDragging) return;
                    isDragging = false;
                    element.style.cursor = 'grab';
                    try { element.releasePointerCapture(e.pointerId); } catch (_) {}
                }
                element.addEventListener('pointerup', endDrag);
                element.addEventListener('pointercancel', endDrag);
            }
            makeDraggable(pet);
            makeDraggable(musicPlayer);
        }

        // ================= 启动 =================
        window.onload = function() {
            loadBackground();
            initEffects();
            loadMessages();
            updateMoodBar(getStore('lishen_last_mood') || '平静');
            var last = getStore('last_chat_time');
            if (!last || (Date.now() - parseInt(last) > 10 * 60 * 1000)) {
                addMessage('你来了。我一直在等你。', 'bot', true);
            }
            
            // 初始位置 (防错位)
            var pet = document.getElementById('desktopPet');
            var container = document.querySelector('.chat-container');
            if (pet && container) {
                var rect = container.getBoundingClientRect();
                pet.style.left = (rect.right - 220) + 'px';
                pet.style.top = (rect.bottom - 220) + 'px';
            }
        };
    </script>
</body>
</html>
